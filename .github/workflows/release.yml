name: Publish unsigned release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate version and tag when present
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/verify-release-version.mjs
          fi

  certify:
    needs: version
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  publish:
    needs: certify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: lonely-chat-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd release-assets
          expected=(
            "lonely-chat-${version}-linux-x86_64.AppImage"
            "lonely-chat-${version}-windows-x64.exe"
            "lonely-chat-${version}-macos-arm64.dmg"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset" || { echo "Missing or empty release asset: $asset"; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Publish only after all three certifications pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Lonely Chat ${GITHUB_REF_NAME}" --generate-notes
