name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm stage:llama
      - run: pnpm smoke:llama
      - run: pnpm stage:whisper
      - run: pnpm smoke:whisper
      - run: xvfb-run -a pnpm smoke:electron
      - run: pnpm exec electron-builder --linux --publish never
      - run: pnpm exec electron-builder --linux --dir --publish never
      - run: xvfb-run -a pnpm certify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-chat-linux-x64
          path: out/*.AppImage
          if-no-files-found: warn
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-15-arm64
            target: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/stage-llama.mjs ${{ matrix.target == '--win' && 'win32-x64' || 'darwin-arm64' }}
      - run: node scripts/stage-whisper.mjs ${{ matrix.target == '--win' && 'win32-x64' || 'darwin-arm64' }}
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - run: pnpm exec electron-builder ${{ matrix.target }} --dir --publish never
      - run: pnpm certify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-chat-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/*.exe
            out/*.dmg
          if-no-files-found: warn
