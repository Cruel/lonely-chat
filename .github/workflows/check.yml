name: Build and verify
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'site/**'
  pull_request:
    paths-ignore:
      - 'site/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-release-version.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: node scripts/stage-llama.mjs linux-x64 --accelerators
      - run: pnpm stage:whisper
      - run: node scripts/verify-native-stage.mjs native linux-x64 --accelerators
      - run: pnpm smoke:llama
      - run: pnpm smoke:whisper
      - run: xvfb-run -a pnpm smoke:electron
      - run: pnpm exec electron-builder --linux --publish never
      - run: pnpm exec electron-builder --linux --dir --publish never
      - run: xvfb-run -a pnpm certify:package
        env:
          LONELY_CHAT_REQUIRE_ACCELERATORS: '1'
      - name: Retain packaged end-to-end result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: certification-report-linux-x64
          path: out/certification-linux-x64.json
          if-no-files-found: warn
          retention-days: 14
      - name: Certify distributed AppImage end to end
        run: xvfb-run -a node scripts/certify-distribution.mjs
      - name: Retain distributed AppImage certification result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: certification-distributed-linux-x64
          path: out/certification-distributed-linux-x64.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lonely-chat-linux-x64
          path: out/*.AppImage
          if-no-files-found: error
          retention-days: 14
  cross-platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: win32-x64
            target: --win
            artifact: windows-x64
          - name: macOS ARM64
            os: macos-26
            platform: darwin-arm64
            target: --mac --arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-release-version.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/stage-llama.mjs ${{ matrix.platform }} --accelerators
      - run: node scripts/stage-whisper.mjs ${{ matrix.platform }}
      - run: node scripts/verify-native-stage.mjs native ${{ matrix.platform }} --accelerators
      - run: pnpm smoke:llama
      - run: pnpm smoke:whisper
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm exec electron-builder ${{ matrix.target }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm certify:package
        env:
          LONELY_CHAT_REQUIRE_ACCELERATORS: '1'
      - run: node scripts/certify-distribution.mjs
      - name: Retain packaged end-to-end result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: certification-report-${{ matrix.artifact }}
          path: out/certification-*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lonely-chat-${{ matrix.artifact }}
          path: |
            out/*.exe
            out/*.dmg
          if-no-files-found: error
          retention-days: 14
